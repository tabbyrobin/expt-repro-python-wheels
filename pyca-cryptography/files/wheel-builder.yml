name: Wheel Builder
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build
  # Do not add any non-tag push events without updating pypi-publish.yml. If
  # you do, it'll upload wheels to PyPI.
  push:
    tags:
      - '*.*'
      - '*.*.*'
  pull_request:
    paths:
      - .github/workflows/wheel-builder.yml
      - .github/requirements/**
      - pyproject.toml
      - vectors/pyproject.toml

env:
  BUILD_REQUIREMENTS_PATH: .github/requirements/build-requirements.txt
  UV_REQUIREMENTS_PATH: .github/requirements/uv-requirements.txt

jobs:
  sdist:
    runs-on: ubuntu-latest
    name: sdists
    steps:
      # The tag to build or the tag received by the tag event

      # - run: git clone https://github.com/pyca/cryptography "$GITHUB_WORKSPACE"
      # - run: git checkout ${{ github.event.inputs.version || github.ref }}

      - run: |
          # git clone --single-branch --branch ${{ github.event.inputs.version || github.ref }} \
          # https://github.com/pyca/cryptography "$GITHUB_WORKSPACE"

          origin=https://github.com/pyca/cryptography
          committish="${{ github.event.inputs.version || github.ref }}"

          cd "$GITHUB_WORKSPACE" && git init
          git remote add origin "$origin"
          git fetch --depth=1 origin "$committish"
          git checkout FETCH_HEAD

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
        timeout-minutes: 3
      - run: python -m pip install -r $UV_REQUIREMENTS_PATH

      - name: Make sdist (cryptography)
        run: uv build --build-constraint=$BUILD_REQUIREMENTS_PATH --require-hashes --sdist
      - name: Make sdist and wheel (vectors)
        run: uv build --build-constraint=$BUILD_REQUIREMENTS_PATH --require-hashes vectors/
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "cryptography-sdist"
          path: dist/cryptography*
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "vectors-sdist-wheel"
          path: vectors/dist/cryptography*

  manylinux:
    needs: [sdist]
    runs-on: ${{ matrix.MANYLINUX.RUNNER }}
    container:
      image: ghcr.io/pyca/${{ matrix.MANYLINUX.CONTAINER }}
      volumes:
        - /staticnodehost:/staticnodecontainer:rw,rshared
        - /staticnodehost:/__e/node20:ro,rshared
    strategy:
      fail-fast: false
      matrix:
        PYTHON:
          - { VERSION: "cp311-cp311", ABI_VERSION: 'py39' }
        MANYLINUX:
          - { NAME: "manylinux_2_34_x86_64", CONTAINER: "cryptography-manylinux_2_34:x86_64", RUNNER: "ubuntu-latest"}

        exclude: []

    name: "${{ matrix.PYTHON.VERSION }} for ${{ matrix.MANYLINUX.NAME }}"
    steps:
      - name: Ridiculous-er workaround for static node20
        run: |
          cp -R /staticnode/* /staticnodecontainer/
          echo "/__e/node20/bin" >> $GITHUB_PATH
      - name: Ridiculous alpine workaround for actions support on arm64
        run: |
          # This modifies /etc/os-release so the JS actions
          # from GH can't detect that it's on alpine:aarch64. It will
          # then use a glibc nodejs, which works fine when gcompat
          # is installed in the container (which it is)
          sed -i "s:ID=alpine:ID=NotpineForGHA:" /etc/os-release
        if: startsWith(matrix.MANYLINUX.NAME, 'musllinux') && endsWith(matrix.MANYLINUX.NAME, 'aarch64')

      - name: Get build-requirements.txt from repository
        run: |
          # git clone https://github.com/pyca/cryptography "$GITHUB_WORKSPACE" &&
          # cd "$GITHUB_WORKSPACE" &&
          # git checkout ${{ github.event.inputs.version || github.ref }} &&
          # git sparse-checkout set --no-cone /${{ env.BUILD_REQUIREMENTS_PATH }}

          origin=https://github.com/pyca/cryptography
          committish="${{ github.event.inputs.version || github.ref }}"
          cd "$GITHUB_WORKSPACE" && git init
          git remote add origin "$origin"
          git fetch --depth=1 origin "$committish"
          # git fetch --depth=1 --sparse --filter=blob:none origin "$committish"
          git sparse-checkout set --no-cone /${{ env.BUILD_REQUIREMENTS_PATH }}
          git checkout FETCH_HEAD

          # TODO make this faster
          # https://stackoverflow.com/questions/56237068/how-to-minimal-clone-repository-to-be-able-list-branches-and-checkout-single-fil
        # https://stackoverflow.com/questions/4114887/is-it-possible-to-do-a-sparse-checkout-without-checking-out-the-whole-repository/63786181#63786181

        # - name: Get build-requirements.txt from repository FASTER
        # run: |
        #   tag=${{ github.event.inputs.version || github.ref }}
        #   git init "$GITHUB_WORKSPACE" && cd "$GITHUB_WORKSPACE"
        #   git remote add origin https://github.com/pyca/cryptography
        #   git fetch origin "$tag" --depth 1 --sparse --filter=blob:none
        #   git sparse-checkout set --no-cone /${{ env.BUILD_REQUIREMENTS_PATH }}
        #   git checkout "$tag"

        #   # git clone --filter=blob:none --no-checkout --depth 1 --sparse <project-url>

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cryptography-sdist
      - run: mkdir tmpwheelhouse
      - name: Build the wheel
        run: |
          tar tvf cryptography*.tar.gz
          sdist_file=$(find . -name 'cryptography*.tar.gz' | head -n 1)
          sdist_file=$(realpath $sdist_file)

          # if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
          #     PY_LIMITED_API="--config-settings=build-args=--features=pyo3/abi3-${{ matrix.PYTHON.ABI_VERSION }}"
          # fi

          # OPENSSL_DIR="/opt/pyca/cryptography/openssl" OPENSSL_STATIC=1 \
          #     uv build \
          #     --python=/opt/python/${{ matrix.PYTHON.VERSION }}/bin/python \
          #     --wheel \
          #     --require-hashes \
          #     --build-constraint=$BUILD_REQUIREMENTS_PATH \
          #     $PY_LIMITED_API \
          #     cryptography*.tar.gz \
          #     -o tmpwheelhouse/

          #####

          # if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
          #     export MATURIN_PEP517_ARGS="--features=pyo3/abi3-${{ matrix.PYTHON.ABI_VERSION }}"
          # fi

          build_reqs=$(realpath $BUILD_REQUIREMENTS_PATH)
          _tmpwheelhouse=$(realpath tmpwheelhouse)
          PROJ_DIR=builddir
          { mkdir -p "$PROJ_DIR" && tar xzf "$sdist_file" -C "$PROJ_DIR" --strip-components=1; }

          export OPENSSL_DIR="/opt/pyca/cryptography/openssl"
          export OPENSSL_STATIC=1

          pushd "$PROJ_DIR"
          uv build \
              --python=/opt/python/${{ matrix.PYTHON.VERSION }}/bin/python \
              --wheel \
              --require-hashes \
              --build-constraint=$build_reqs \
              $PY_LIMITED_API \
              . \
              -o $_tmpwheelhouse

          popd

          # uv venv --relocatable
          # . .venv/bin/activate
          # uv pip install maturin[patchelf]
          # uv pip install build
          # uv pip install --require-hashes -r "$BUILD_REQUIREMENTS_PATH"
          # # uv run \
          # maturin build \
          # maturin pep517 build-wheel \
          #   --interpreter "/opt/python/${{ matrix.PYTHON.VERSION }}/bin/python" \
          #   -o tmpwheelhouse \
          #   cryptography*.tar.gz

          ###

          # uv venv --relocatable
          # uv pip install maturin[patchelf]
          # uv pip install pip
          # uv pip install --require-hashes -r "$BUILD_REQUIREMENTS_PATH"

          # sdist_file_hash=sha256:$(sha256sum $sdist_file | cut -d ' ' -f 1)
          # printf 'file://%s --hash=%s\n' "$(realpath $sdist_file)" "$sdist_file_hash" \
          #   >sdist_meta_req.txt
          # echo ====
          # cat sdist_meta_req.txt
          # echo ====

          # Example:
          # file:///home/user/QubesIncoming/a-devel/python-wheels-repro/pyca-cryptography/py-cryptography.git/cryptography-44.0.2.tar.gz
          # --hash=sha256:51c9d576bc428dce8c30cd2958f79d7dcbe645c98b5409b9a378cdb706975b17

          # . .venv/bin/activate
          # "/opt/python/${{ matrix.PYTHON.VERSION }}/bin/python" -m pip wheel \
          #   --no-use-pep517 \
          #   --no-build-isolation --no-deps \
          #   --require-hashes \
          #   --constraint "$BUILD_REQUIREMENTS_PATH" \
          #   -r sdist_meta_req.txt \
          #   --wheel-dir tmpwheelhouse \
          #   $sdist_file
          # cryptography*.tar.gz

          # -r "$BUILD_REQUIREMENTS_PATH" \

          # maturin pep517 build-wheel -i /home/user/QubesIncoming/a-devel/python-wheels-repro/pyca-cryptography/py-cryptography.git/MAGIC_uv_cache/builds-v0/.tmpaT7NYX/bin/python --compatibility off --features=pyo3/abi3-py39

          ###

          # export OPENSSL_DIR="/opt/pyca/cryptography/openssl"
          # export OPENSSL_STATIC=1
          # uv venv --python=/opt/python/${{ matrix.PYTHON.VERSION }}/bin/python

          # uv pip install --cache-dir .cache  --require-hashes \
          #   --build-constraints=$BUILD_REQUIREMENTS_PATH

          # uv pip install --cache-dir .cache --require-hashes -r $BUILD_REQUIREMENTS_PATH

          # uv run maturin build $PY_LIMITED_API cryptography*.tar.gz -o tmpwheelhouse/

        env:
          RUSTUP_HOME: /root/.rustup
      - run: auditwheel repair --plat ${{ matrix.MANYLINUX.NAME }} tmpwheelhouse/cryptography*.whl -w wheelhouse/
      - run: unzip wheelhouse/*.whl -d execstack.check
      - run: |
          results=$(readelf -lW execstack.check/cryptography/hazmat/bindings/*.so)
          count=$(echo "$results" | grep -c 'GNU_STACK.*[R ][W ]E' || true)
          if [ "$count" -ne 0 ]; then
            exit 1
          else
            exit 0
          fi

      - run: uv venv --python=/opt/python/${{ matrix.PYTHON.VERSION }}/bin/python
      - run: uv pip install --require-hashes -r $BUILD_REQUIREMENTS_PATH
      - run: uv pip install cryptography --no-index -f wheelhouse/
      - run: |
          echo "from cryptography.hazmat.backends.openssl.backend import backend;print('Loaded: ' + backend.openssl_version_text());print('Linked Against: ' + backend._ffi.string(backend._lib.OPENSSL_VERSION_TEXT).decode('ascii'))" | uv run -

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "cryptography-${{ github.event.inputs.version }}-${{ matrix.MANYLINUX.NAME }}-${{ matrix.PYTHON.VERSION }}-${{ matrix.PYTHON.ABI_VERSION }}"
          path: wheelhouse/

  macos:
    needs: [sdist]
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        PYTHON:
          - VERSION: '3.11'
            ABI_VERSION: 'py37'
            # Despite the name, this is built for the macOS 11 SDK on arm64 and 10.9+ on intel
            DOWNLOAD_URL: 'https://www.python.org/ftp/python/3.11.3/python-3.11.3-macos11.pkg'
            BIN_PATH: '/Library/Frameworks/Python.framework/Versions/3.11/bin/python3'
            DEPLOYMENT_TARGET: '10.13'
            # This archflags is default, but let's be explicit
            ARCHFLAGS: '-arch x86_64 -arch arm64'
            # See https://github.com/pypa/cibuildwheel/blob/c8876b5c54a6c6b08de5d4b1586906b56203bd9e/cibuildwheel/macos.py#L257-L269
            # This will change in the future as we change the base Python we
            # build against
            _PYTHON_HOST_PLATFORM: 'macosx-10.9-universal2'
          - VERSION: '3.11'
            ABI_VERSION: 'py39'
            # Despite the name, this is built for the macOS 11 SDK on arm64 and 10.9+ on intel
            DOWNLOAD_URL: 'https://www.python.org/ftp/python/3.11.3/python-3.11.3-macos11.pkg'
            BIN_PATH: '/Library/Frameworks/Python.framework/Versions/3.11/bin/python3'
            DEPLOYMENT_TARGET: '10.13'
            # This archflags is default, but let's be explicit
            ARCHFLAGS: '-arch x86_64 -arch arm64'
            # See https://github.com/pypa/cibuildwheel/blob/c8876b5c54a6c6b08de5d4b1586906b56203bd9e/cibuildwheel/macos.py#L257-L269
            # This will change in the future as we change the base Python we
            # build against
            _PYTHON_HOST_PLATFORM: 'macosx-10.9-universal2'
          - VERSION: 'pypy-3.10'
            BIN_PATH: 'pypy3'
            DEPLOYMENT_TARGET: '10.13'
            _PYTHON_HOST_PLATFORM: 'macosx-10.9-x86_64'
            ARCHFLAGS: '-arch x86_64'
    name: "${{ matrix.PYTHON.VERSION }} ABI ${{ matrix.PYTHON.ABI_VERSION }} macOS ${{ matrix.PYTHON.ARCHFLAGS }}"
    steps:
      - name: Get build-requirements.txt from repository
        uses: actions/checkout@v3
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
          sparse-checkout: |
            ${{ env.BUILD_REQUIREMENTS_PATH }}
            ${{ env.UV_REQUIREMENTS_PATH }}
          sparse-checkout-cone-mode: false
      - name: Setup python
        run: |
          curl "$PYTHON_DOWNLOAD_URL" -o python.pkg
          sudo installer -pkg python.pkg -target /
        env:
          PYTHON_DOWNLOAD_URL: ${{ matrix.PYTHON.DOWNLOAD_URL }}
        if: contains(matrix.PYTHON.VERSION, 'pypy') == false
      - name: Setup pypy
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
        if: contains(matrix.PYTHON.VERSION, 'pypy')
      - uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          repo: pyca/infra
          workflow: build-macos-openssl.yml
          branch: main
          workflow_conclusion: success
          name: openssl-macos-universal2
          path: "../openssl-macos-universal2/"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8
        with:
          toolchain: stable
          # Add the arm64 target in addition to the native arch (x86_64)
          target: aarch64-apple-darwin
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cryptography-sdist

      - run: ${{ matrix.PYTHON.BIN_PATH }} -m pip install -r "${UV_REQUIREMENTS_PATH}"
      - run: mkdir wheelhouse
      - name: Build the wheel
        run: |
          if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
              PY_LIMITED_API="--config-settings=build-args=--features=pyo3/abi3-${{ matrix.PYTHON.ABI_VERSION }}"
          fi

          OPENSSL_DIR="$(readlink -f ../openssl-macos-universal2/)" \
              OPENSSL_STATIC=1 \
              uv build --wheel --require-hashes --build-constraint=$BUILD_REQUIREMENTS_PATH $PY_LIMITED_API cryptography*.tar.gz -o wheelhouse/
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.PYTHON.DEPLOYMENT_TARGET }}
          ARCHFLAGS: ${{ matrix.PYTHON.ARCHFLAGS }}
          _PYTHON_HOST_PLATFORM: ${{ matrix.PYTHON._PYTHON_HOST_PLATFORM }}

      - run: uv venv
      - run: uv pip install --require-hashes -r $BUILD_REQUIREMENTS_PATH
      - run: uv pip install cryptography --no-index -f wheelhouse/
      - name: Show the wheel's minimum macOS SDK and architectures
        run: |
          find .venv/lib/*/site-packages/cryptography/hazmat/bindings -name '*.so' -exec vtool -show {} \;
      - run: |
          echo "from cryptography.hazmat.backends.openssl.backend import backend;print('Loaded: ' + backend.openssl_version_text());print('Linked Against: ' + backend._ffi.string(backend._lib.OPENSSL_VERSION_TEXT).decode('ascii'))" | uv run -

      - run: |
          echo "CRYPTOGRAPHY_WHEEL_NAME=$(basename $(ls wheelhouse/cryptography*.whl))" >> $GITHUB_ENV
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "${{ env.CRYPTOGRAPHY_WHEEL_NAME }}"
          path: wheelhouse/

  windows:
    needs: [sdist]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        WINDOWS:
          - {ARCH: 'x86', WINDOWS: 'win32', RUST_TRIPLE: 'i686-pc-windows-msvc'}
          - {ARCH: 'x64', WINDOWS: 'win64', RUST_TRIPLE: 'x86_64-pc-windows-msvc'}
        PYTHON:
          - {VERSION: "3.11", "ABI_VERSION": "py39"}
        exclude:
          # We need to exclude the below configuration because there is no 32-bit pypy3
          - WINDOWS: {ARCH: 'x86', WINDOWS: 'win32', RUST_TRIPLE: 'i686-pc-windows-msvc'}
            PYTHON: {VERSION: "pypy-3.10"}
    name: "${{ matrix.PYTHON.VERSION }} ${{ matrix.WINDOWS.WINDOWS }} ${{ matrix.PYTHON.ABI_VERSION }}"
    steps:
      - name: Get build-requirements.txt from repository
        uses: actions/checkout@v3
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
          sparse-checkout: |
            ${{ env.BUILD_REQUIREMENTS_PATH }}
            ${{ env.UV_REQUIREMENTS_PATH }}
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cryptography-sdist

      - name: Setup python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
          architecture: ${{ matrix.WINDOWS.ARCH }}
      - uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8
        with:
          toolchain: stable
          target: ${{ matrix.WINDOWS.RUST_TRIPLE }}

      - uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          repo: pyca/infra
          workflow: build-windows-openssl.yml
          branch: main
          workflow_conclusion: success
          name: "openssl-${{ matrix.WINDOWS.WINDOWS }}"
          path: "C:/openssl-${{ matrix.WINDOWS.WINDOWS }}/"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure OpenSSL
        run: |
            echo "OPENSSL_DIR=C:/openssl-${{ matrix.WINDOWS.WINDOWS }}" >> $GITHUB_ENV
            echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        shell: bash

      - run: pip install -r "${UV_REQUIREMENTS_PATH}"
        shell: bash
      - run: mkdir wheelhouse
      - run: |
          if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
              PY_LIMITED_API="--config-settings=build-args=--features=pyo3/abi3-${{ matrix.PYTHON.ABI_VERSION }}"
          fi

          uv build --wheel --require-hashes --build-constraint=$BUILD_REQUIREMENTS_PATH cryptography*.tar.gz $PY_LIMITED_API -o wheelhouse/
        shell: bash

      - run: uv venv
      - run: uv pip install --require-hashes -r "${BUILD_REQUIREMENTS_PATH}"
        shell: bash
      - run: uv pip install cryptography --no-index -f wheelhouse/
      - name: Print the OpenSSL we built and linked against
        run: |
            echo "from cryptography.hazmat.backends.openssl.backend import backend;print('Loaded: ' + backend.openssl_version_text());print('Linked Against: ' + backend._ffi.string(backend._lib.OPENSSL_VERSION_TEXT).decode('ascii'))" | uv run -

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "cryptography-${{ github.event.inputs.version }}-${{ matrix.WINDOWS.WINDOWS }}-${{ matrix.PYTHON.VERSION }}-${{ matrix.PYTHON.ABI_VERSION }}"
          path: wheelhouse\
